name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest flake8

      - name: Lint
        run: python -m flake8 scripts tests .github/scripts --max-line-length=160

      - name: Run tests
        run: python -m pytest -q

  version-check:
    name: Version format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate declared version
        id: version
        run: python .github/scripts/get_version.py

      - name: Validate changelog entry
        run: python .github/scripts/build_release_notes.py "${{ steps.version.outputs.version }}" "$RUNNER_TEMP/release-notes.md"
